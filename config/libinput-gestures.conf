# ==============================================================================
# Cấu hình Cử chỉ Bàn rê cảm ứng (Trackpad Gestures) chuẩn Windows 10 / 11
# Tối ưu hóa: Chỉ dùng 3 ngón tay - Độ chính xác cao, trực quan và đối xứng 100%
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Thao tác Vuốt Dọc (Lên / Xuống chuẩn phản xạ tự nhiên Windows)
# ------------------------------------------------------------------------------
# Vuốt 3 ngón XUỐNG: Luôn luôn Thu nhỏ tất cả để Hiện Desktop (Show Desktop)
gesture swipe down 3 ~/.local/bin/gesture-swipe-down.sh

# Vuốt 3 ngón LÊN: 
# - Nếu vừa ở Desktop: Khôi phục lại toàn bộ cửa sổ (Restore Windows)
# - Nếu đang làm việc: Mở Task View / Thumbnail Switcher OSD để duyệt app
gesture swipe up 3 ~/.local/bin/gesture-swipe-up.sh

# ------------------------------------------------------------------------------
# 2. Thao tác Vuốt Ngang (Trái / Phải chuyển đổi ứng dụng Alt + Tab)
# ------------------------------------------------------------------------------
# Vuốt 3 ngón SANG PHẢI: Chuyển sang cửa sổ tiếp theo (tương đương Alt + Tab)
gesture swipe right 3 wtype -M alt -k Tab -m alt

# Vuốt 3 ngón SANG TRÁI: Chuyển về cửa sổ trước đó (tương đương Alt + Shift + Tab)
gesture swipe left 3 wtype -M alt -M shift -k Tab -m shift -m alt

# ------------------------------------------------------------------------------
# 3. Chuyển đổi Desktop ảo (Virtual Desktops)
# ------------------------------------------------------------------------------
# ĐÃ BỎ HOÀN TOÀN TRÊN BÀN RÊ TRACKPAD THEO YÊU CẦU.
# Chỉ chuyển đổi qua phím tắt chuẩn: Ctrl + Win + Mũi tên Trái/Phải hoặc click chuột trên Taskbar.

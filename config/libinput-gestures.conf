# ==============================================================================
# Cấu hình Cử chỉ Bàn rê cảm ứng (Trackpad Gestures)
# CHỈ DUY NHẤT 2 THAO TÁC VUỐT DỌC:
# - Vuốt XUỐNG: Thu nhỏ tất cả để về Desktop
# - Vuốt LÊN: Khôi phục lại các cửa sổ về màn hình
# ==============================================================================

# Vuốt 3 ngón XUỐNG: Thu nhỏ tất cả để Hiện Desktop
gesture swipe down 3 ~/.local/bin/gesture-swipe-down.sh

# Vuốt 3 ngón LÊN: Khôi phục lại toàn bộ cửa sổ vừa thu nhỏ
gesture swipe up 3 ~/.local/bin/gesture-swipe-up.sh

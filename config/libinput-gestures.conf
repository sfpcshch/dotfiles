# ==============================================================================
# Cấu hình Cử chỉ Bàn rê cảm ứng (Trackpad Gestures) chuẩn Windows 10 / 11
# Tối ưu hóa: Chỉ dùng 3 ngón tay - Độ chính xác cao, trực quan và đối xứng 100%
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Thao tác Vuốt Dọc (Lên / Xuống đối xứng như kéo rèm)
# ------------------------------------------------------------------------------
# Vuốt 3 ngón XUỐNG: Thu nhỏ tất cả để Hiện Desktop (tương đương Win + D)
gesture swipe down 3 wtype -M logo -k d -m logo

# Vuốt 3 ngón LÊN: Khôi phục lại các cửa sổ vừa thu nhỏ (tương đương Win + D)
gesture swipe up 3 wtype -M logo -k d -m logo

# ------------------------------------------------------------------------------
# 2. Thao tác Vuốt Ngang (Trái / Phải chuyển đổi ứng dụng Alt + Tab)
# ------------------------------------------------------------------------------
# Vuốt 3 ngón SANG PHẢI: Chuyển sang cửa sổ tiếp theo (tương đương Alt + Tab)
gesture swipe right 3 wtype -M alt -k Tab -m alt

# Vuốt 3 ngón SANG TRÁI: Chuyển về cửa sổ trước đó (tương đương Alt + Shift + Tab)
gesture swipe left 3 wtype -M alt -M shift -k Tab -m shift -m alt

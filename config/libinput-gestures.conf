# ==============================================================================
# Cấu hình Cử chỉ Bàn rê cảm ứng (Trackpad Gestures) chuẩn Windows 10 / 11
# Dành cho Wayland (Labwc + Noctalia Shell)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Thao tác 3 ngón tay (Windows Multi-tasking Gestures)
# ------------------------------------------------------------------------------
# Vuốt 3 ngón LÊN: Mở Task View / Trình chuyển đổi cửa sổ dạng Thumbnail OSD
gesture swipe up 3 bash -c "wtype -M logo -k Tab; sleep 1.0; wtype -m logo"

# Vuốt 3 ngón XUỐNG: Thu nhỏ tất cả để Hiện Desktop (tương đương Win + D)
gesture swipe down 3 wtype -M logo -k d -m logo

# Vuốt 3 ngón SANG PHẢI: Chuyển sang cửa sổ tiếp theo (tương đương Alt + Tab)
gesture swipe right 3 wtype -M alt -k Tab -m alt

# Vuốt 3 ngón SANG TRÁI: Chuyển về cửa sổ trước đó (tương đương Alt + Shift + Tab)
gesture swipe left 3 wtype -M alt -M shift -k Tab -m shift -m alt

# ------------------------------------------------------------------------------
# 2. Thao tác 4 ngón tay (Windows Virtual Desktops)
# ------------------------------------------------------------------------------
# Vuốt 4 ngón SANG PHẢI: Chuyển sang Desktop ảo bên phải (tương đương Ctrl + Win + Right)
gesture swipe right 4 noctalia msg workspace-switch next

# Vuốt 4 ngón SANG TRÁI: Chuyển sang Desktop ảo bên trái (tương đương Ctrl + Win + Left)
gesture swipe left 4 noctalia msg workspace-switch prev

# Vuốt 4 ngón LÊN: Mở Task View dạng Thumbnail OSD (tương đương Win + Tab)
gesture swipe up 4 bash -c "wtype -M logo -k Tab; sleep 1.0; wtype -m logo"

# Vuốt 4 ngón XUỐNG: Thu nhỏ tất cả / Hiện Desktop (Win + D)
gesture swipe down 4 wtype -M logo -k d -m logo

"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

# Block 1: Fast username/session module (<1ms, direct memory lookup, root warning)
# Powerline multi-color segments with prev_bg transitions for dynamic git/duration handling
format = '''
[┌](green)$username[](fg:green bg:blue)$directory$git_branch$git_status$cmd_duration[](fg:prev_bg bg:surface1)$time[](fg:prev_bg)
$character'''

[username]
show_always = true
style_user = "bg:green fg:base bold"
style_root = "bg:red fg:base bold"
format = "[ 󰣇 $user ]($style)"

[directory]
style = "bg:blue fg:base bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bg:yellow fg:base bold"
symbol = " "
format = "[](fg:prev_bg bg:yellow)[ $symbol$branch ]($style)"

[git_status]
style = "bg:yellow fg:red bold"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 2_000
style = "bg:surface0 fg:yellow bold"
format = "[](fg:prev_bg bg:surface0)[ 󰅐 $duration ]($style)"

# Timestamp marker segment
[time]
disabled = false
time_format = "%R"
style = "bg:surface1 fg:white bold"
format = "[  $time ]($style)"

# Input prompt line, seamless gapless ⚡ symbol matching the frame connector
[character]
success_symbol = "[└⚡](bold green) "
error_symbol = "[└⚡](bold red) "


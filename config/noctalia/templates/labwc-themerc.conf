# Automatically synchronized with Noctalia Material You Theme (Native Template Engine)

# Windows 10 style rectangular titlebar buttons (flush dimensions)
border.width: 1
window.button.width: 22
window.button.height: 20
window.button.spacing: 6
window.titlebar.padding.width: 0
window.titlebar.padding.height: 0

# Left-align window title label next to app icon
window.label.text.justify: left

# Titlebar & Borders: Active gets Monet primary accent, Inactive gets dark Monet secondary_container tint
window.active.title.bg: Solid
window.active.title.bg.color: {{colors.primary.default.hex}}d9
window.active.label.text.color: {{colors.on_primary.default.hex}}
window.active.border.color: {{colors.primary.default.hex}}
window.active.indicator.toggled-keybind.color: {{colors.error.default.hex}}

window.inactive.title.bg: Solid
window.inactive.title.bg.color: {{colors.surface_container_high.default.hex}}d9
window.inactive.label.text.color: {{colors.on_surface_variant.default.hex}}
window.inactive.border.color: {{colors.surface_container_high.default.hex}}

# Titlebar button hover overlay
window.button.hover.bg.color: {{colors.surface_container_highest.default.hex}}80

# Alt+Tab window switcher OSD (synchronized with Monet & translucent glass)
osd.bg.color: {{colors.surface_container_low.default.hex}}d9
osd.border.color: {{colors.secondary_container.default.hex}}cc
osd.border.width: 1
osd.label.text.color: {{colors.on_surface.default.hex}}
osd.window-switcher.style-thumbnail.item.active.border.color: {{colors.primary.default.hex}}
osd.window-switcher.style-thumbnail.item.active.bg.color: {{colors.primary.default.hex}}33
osd.window-switcher.preview.border.color: {{colors.primary.default.hex}}

# Context Menu
menu.border.width: 1
menu.border.color: {{colors.secondary_container.default.hex}}cc
menu.items.bg.color: {{colors.surface_container_low.default.hex}}d9
menu.items.text.color: {{colors.on_surface.default.hex}}
menu.items.active.bg.color: {{colors.primary.default.hex}}d9
menu.items.active.text.color: {{colors.on_primary.default.hex}}
menu.items.padding.x: 12
menu.items.padding.y: 6
menu.separator.width: 1
menu.separator.padding.width: 6
menu.separator.padding.height: 4
menu.separator.color: {{colors.outline_variant.default.hex}}66
menu.title.bg.color: {{colors.surface_container_low.default.hex}}d9
menu.title.text.color: {{colors.on_surface.default.hex}}

[bar.default]
position = "bottom"
background_opacity = 0.75
center = []
end = [
    "tray",
    "Spacer_2",
    "clipboard",
    "Spacer_2",
    "network",
    "volume",
    "battery",
    "Spacer_2",
    "date",
    "clock",
    "Spacer_2",
    "notifications",
    "Spacer",
    "show_desktop"
]
margin_edge = 0
margin_ends = 0
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "Spacer_Power", "session", "Spacer_Power", "taskbar" ]
thickness = 32

[wallpaper.default]
path = "/usr/share/wallpapers/cachyos-wallpapers/cachysurf4.jpg"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.Screen-off]
    action = "screen-off"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 900.0

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
corner_radius_scale = 0.0
polkit_agent = true
settings_show_advanced = true

[shell.launcher]
app_grid = false
sort_by_usage = true

[shell.panel]
borders = true
shadow = true
transparency_mode = "soft"
floating_layer = "overlay"
floating_offset = 0
control_center_placement = "floating"
control_center_position = "bottom_right"
launcher_placement = "floating"
launcher_position = "bottom_left"
session_placement = "floating"
session_position = "bottom_left"
clipboard_placement = "floating"
clipboard_position = "bottom_right"
open_near_click_control_center = false
open_near_click_launcher = false
open_near_click_session = true
open_near_click_clipboard = false

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[widget.Spacer]
length = 10
type = "spacer"

[widget.Spacer_2]
type = "spacer"

[widget.date]
format = "{:%a %d %b -}"

[widget.launcher]
custom_image = "/usr/share/icons/hicolor/scalable/apps/org.cachyos.hello.svg"
scale = 1.3

[widget.network]
show_label = false

[widget.taskbar]
group_by_workspace = false
icon_scale = 1.35
active_opacity = 1.0
inactive_opacity = 1.0
pinned_opacity = 0.65
show_active_indicator = true

[location]
auto_locate = false

[weather]
enabled = false

[widget.tray]
drawer = true
drawer_columns = 4
drawer_item_size = 22

[widget.show_desktop]
type = "text"
text = "│"

[widget.show_desktop.actions]
left = "exec toggle-desktop.sh"




[widget.Spacer_Power]
length = 12
type = "spacer"

[widget.battery]
show_label = false

[widget.volume]
show_label = false
